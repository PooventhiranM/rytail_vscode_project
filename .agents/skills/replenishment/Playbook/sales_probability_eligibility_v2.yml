# ── Decisions ───────────────────────────────────────────────────────────────
decisions:
  sell_through_formula: >
    SUPPLIED BY THE USER 2026-09-07 and ADOPTED VERBATIM as the canonical
    sell-through shape. Canonical form, as given (over the `performance`
    dataset's column names):

      CASE
        WHEN (IFNULL(`tillDateSaleQty`,0) + IFNULL(`stockOnhandQty`,0)) = 0
        THEN 0
        ELSE
          IFNULL(`tillDateSaleQty`,0)
          /
          (IFNULL(`tillDateSaleQty`,0) + IFNULL(`stockOnhandQty`,0))
          * 100
      END

    COLUMN MAPPING onto this playbook's source, applied AFTER the size ->
    Reference roll-up (so the operands are the SUMs, not raw cells):
      tillDateSaleQty  -> SUM(q7)  for SellThrough_7d_pct
                       -> SUM(q28) for SellThrough_28d_pct
      stockOnhandQty   -> SUM(stock)
    ASSUMPTION, FLAGGED: only the formula SHAPE is adopted. The operands come
    from replenishment_order_details, NOT from the `performance` dataset those
    column names belong to — consistent with this playbook's whole premise and
    with REPL-SPE-01's explicit rejection of `performance` as the sell-through
    source. If the intent was to source W1/W2 from `performance` instead, that
    is a different change and this file needs revisiting.

    RELATIONSHIP TO REPL-SPE-01: numerically identical to its confirmed
    formula in the normal case — both are qty / (qty + stock) x 100 with the
    0/0 case returning 0%. The differences are in the guards:
      - This form guards NULL (IFNULL) and does so explicitly.
      - This form makes the zero-denominator case an EXPLICIT branch rather
        than relying on the engine returning NULL for x/0.
      - This form does NOT clamp negatives, which REPL-SPE-01's confirmed
        rule does. See negative_value_handling.
  negative_value_handling: >
    CONFIRMED AND ENFORCED: Zero-floor clamping is strictly mandatory.
    Whenever any quantity (Qty_7d, Qty_28d, StoreStockOnHandQty, WarehouseStockOnHandQty)
    evaluates to a negative number (e.g. from customer returns exceeding gross sales),
    it is automatically assumed and clamped to 0:
      Qty_7d = MAX(0, Qty_7d)
      Qty_28d = MAX(0, Qty_28d)
      StockOnHandQty = MAX(0.0, StockOnHandQty)
      WarehouseStockOnHandQty = MAX(0, WarehouseStockOnHandQty)
    No negative values are allowed in intermediate calculations or in final Domo persistence.
  warehouse_stock_integration_and_zero_stock_rule: >
    ADOPTED FROM REPL-ELIG-01. This playbook integrates the Zero-Warehouse-Stock
    rule directly into the evaluation pipeline using the pre-joined
    "Warehouse Current Stock Qty" column from the ETL dataset.
    RATIONALE:
      The ETL process combines the central warehouse inventory snapshot and
      the store sales/stock ledgers into Replenishment Order Details.
      Therefore, warehouse stock availability is evaluated per Store + Reference
      group BEFORE running store demand eligibility:
        - If WarehouseStockOnHandQty <= 0 -> Dropped immediately with
          ReplenishmentQty = 0, ConfidenceScore = 100, and
          ReplenishmentReason = "No stock in warehouse".
        - If WarehouseStockOnHandQty > 0 -> Proceeds to Tier 2 Store Sales
          Probability (SSP) scoring and threshold comparison.
      This preserves 100% of ELIG-01's supply-side gating without requiring a
      separate join against warehouse_invdetails.
  w4_denominator: >
    OPEN. StockAdjustedFactor_pct is computed as
    100.0 * MAX(avail28) / 28, which preserves
    REPL-SPE-01.decisions.w4_formula's confirmed semantic ("the % of the last
    28 days the store actually had stock to sell") and its denominator.
    BUT this dataset's availability column never exceeds 27, so the result is
    pinned at 96.4286% for the overwhelming majority of rows and can never
    reach the 100.0 REPL-SPE-01 live-tested.
    DELIBERATELY NOT CHANGED to /27. Dividing by 27 would make the numbers
    look right while inventing a rule nobody confirmed. The correct fix is an
    answer from the ETL owner about what the 0..6 / 1..27 ranges mean — see
    open_blockers.availability_off_by_one.
  scoping_by_reference_not_family: >
    CONFIRMED BY MEASUREMENT (not preference). Every query is scoped by an
    explicit Reference list from computation.query_0, never by Family against
    the source dataset. Rationale and measured cost:
    source_dataset.verified_facts.product_attributes_are_missing_on_63_percent_of_rows.
  w1_w2_w3_w4_weights: >
    CARRIED FORWARD UNCHANGED from REPL-SPE-01 (confirmed with Pugal
    2026-08-27): W1 = 40 (7-day sell-through), W2 = 30 (28-day sell-through),
    W3 = 15 (store demand index), W4 = 15 (stock-adjusted factor). Sum 100.
  w3_scope_and_normalization: >
    CARRIED FORWARD UNCHANGED from REPL-SPE-01.decisions.w3_normalization /
    w3_window / demand_index_scope: 28-day window; network-wide across ALL
    stores (not cluster/tier peers); DemandIndex = StoreShare / FairShare,
    where FairShare = 1 / (count of stores that sold the family at all);
    normalised by PERCENTILE RANK, not a capped-linear scale.
    W3 IS COMPUTED OVER THE FULL FAMILY (all 47 References), NOT narrowed to
    the thresholded 7 — a store's demand share is a property of the whole
    family. Same rule as REPL-SPE-01.computation.pipeline step 5.
  view4_view5_join_type: >
    CARRIED FORWARD UNCHANGED: query_a LEFT JOINs query_b by StoreCode only.
    Every query_a row is kept; a store absent from query_b gets
    StoreDemandIndex_pct = 0 (lowest possible, not null, not dropped).
  ssp_threshold_comparison: >
    CARRIED FORWARD UNCHANGED: Eligible = (SSP >= SalesThresholdPct),
    inclusive.
  threshold_coverage_gap: >
    CARRIED FORWARD UNCHANGED. Only References WITH a defined Sales
    Threshold % appear in the output; References outside
    store_sku_min_display_mapping's coverage are excluded entirely — not
    included with a null flag, not defaulted.
    RE-VERIFIED 2026-09-07 against the real files: 7 of the family's 47
    References have a threshold (25% for BCDN00001INDIGO and BCDN00002GREY,
    30% for the five BCDN00003* variants).
    NOTE a correction to REPL-SPE-01.decisions.threshold_coverage_gap, which
    says "the four BCDN00003* variants": there are FIVE (BLACK, GREY, ICE,
    INDIGO, MID STONE). 2 + 5 = the 7 total it states elsewhere, so its total
    is right and only the parenthetical is off by one.
  pagination: >
    STILL REQUIRED BUT NO LONGER SEVERE. query_a returns 733 rows and query_b
    168 rows for BOYS CORE DENIM — both fit in a single page. A large family
    could exceed it, so
    REPL-SPE-01.decisions.raw_json_pagination_cap's discipline still applies
    in full: check the response's own `truncated` flag on EVERY page, advance
    the offset by the rows actually returned, and never infer "last page" from
    a short row count. Cross-validate a large total against a separate
    COUNT(*).
  domo_sql_dialect: >
    VERIFIED LIVE 2026-09-07 by probing the engine directly.
    NOT SUPPORTED: GREATEST() — returns errorCode ib:4201 "Unsupported
    function or function parameters". An earlier draft of query_a used it for
    clamping and failed outright.
    SUPPORTED and used here: CASE WHEN, IF, IFNULL, COALESCE, NULLIF, TRIM,
    ROUND, ABS, CONCAT, aggregate MAX/SUM/COUNT, and subqueries in FROM.
    Division by zero returns NULL rather than raising — which is why
    decisions.sell_through_formula's explicit zero branch is preferable to
    relying on engine behaviour.
    Multiply by 100.0 (not 100) to force decimal division; integer division
    floors every percentage to 0.

# ── Computation ─────────────────────────────────────────────────────────────
computation:
  status: >
    SQL EXECUTED LIVE 2026-09-07 for Calendar plan A (family = BOYS CORE
