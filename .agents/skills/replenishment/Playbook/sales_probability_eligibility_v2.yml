playbook_id: "REPL-SPE-02"
playbook_name: "Store Eligibility & Sales Probability (v2 — Unified Replenishment Order Details source)"
short_name: "sales_probability_v2"

description: >
  UNIFIES AND ENCOMPASSES BOTH REPL-ELIG-01 (Warehouse Supply Filter / Zero-Stock
  Rule) AND REPL-SPE-02 (Store Sales Probability Demand Scoring) into ONE
  comprehensive replenishment eligibility playbook.

  Re-sources all store and warehouse metrics from ONE pre-aggregated Domo ETL
  dataset, "DEV|Rytail|OUT|Replenishment Order Details"
  (8152de75-f313-47f6-a50c-48b524fcb503), instead of rebuilding them across
  multiple raw sales, inventory, and ledger datasets.

  CORE BUSINESS LOGIC PRESERVED 100% FROM OLDER PLAYBOOKS:
    1. CORE QUESTION: "Which Store + Reference pairs are eligible for replenishment
       for this Calendar Plan — verifying BOTH that the warehouse has stock on hand,
       AND that the store meets sales velocity thresholds (SSP >= SalesThresholdPct)?"
    2. ENTITY / GRAIN: Strictly StoreCode + Reference grain, rolled up across sizes.
    3. OPTIMIZED 3-STEP REPLENISHMENT PIPELINE:
       - Step 1 (Upfront Warehouse Quantity Filter): Check the warehouse quantity first.
         If WarehouseStockOnHandQty <= 0 -> eliminate those records upfront.
         Flag as Eligible = FALSE, ReplenishmentQty = 0, ConfidenceScore = 100,
         ReplenishmentReason = "No stock in warehouse". Dropping zero-stock items
         eliminates unnecessary downstream computations.
       - Step 2 (Group by ProdReference Volume Reduction):
         Group the Store_Sku_Min_Display_mapping table (7491b7c0-28e1-46fb-804f-79e69b714dc3)
         by ProdReference:
           SELECT ProdReference, MAX(`Sales Threshold %`) AS SalesThresholdPct
           FROM table GROUP BY ProdReference;
         This collapses 245,175 store/SKU/size rows down to ~292 reference-level thresholds
         (and just 7 for BOYS CORE DENIM), reducing data volume by 99.8%.
       - Step 3 (4-Week Weighted SSP Calculation & Threshold Comparison):
         Compute the 4-week weighted SSP score:
           SSP = 0.40(W1) + 0.30(W2) + 0.15(W3) + 0.15(W4)
         Compare against SalesThresholdPct from Step 2:
           Eligible = (SSP >= SalesThresholdPct)
    4. OUTPUT METRICS: Full 16-metric schema combining warehouse inventory status,
       store sales/stock, W1-W4 components, SSP score, and reason codes.
    5. WHAT IT DROPS:
       - Dropped by supply: Zero/negative warehouse stock.
       - Dropped by demand: Store SSP below Sales Threshold %.

  WHY THIS ETL DATASET:
    The new dataset already carries, per store + product, the last-7-day and
    last-28-day sale quantity, current store stock, current warehouse stock, days
    of stock availability over both windows, and the product attributes
    (Reference / Family / Size / Division / SKU) pre-joined. This completely
    replaces the need for 3 nested client-side merges, 4 raw datasets, and date
    pagination over millions of historical rows.

# ── Mandatory Downstream Pipeline Execution ──────────────────────────────────
downstream_pipeline:
  next_playbook: "store_replenishment_order_allocation.yml"
  playbook_id: "REPL-ORD-01"
  execution_policy: "MANDATORY_AUTOMATIC_CONTINUATION"
  description: >
    Immediately upon successfully scoring eligibility and appending the results
    to SSP_eligibility_Final (a1bf0a87-d46a-48a3-a4c0-7fc47d3137c5) with a new RunId,
    the execution engine MUST automatically trigger and run REPL-ORD-01
    (store_replenishment_order_allocation.yml) without halting or asking for user confirmation.
  handoff_parameters:
    target_plan_name: "CalendarPlanName of the current active plan (e.g. 'Calendar plan A')"
    target_run_id: "The exact RunId newly incremented and persisted in SSP_eligibility_Final (e.g. 3)"

# ── Provenance of every claim in this file ──────────────────────────────────
provenance: >
  Facts labelled VERIFIED LIVE were obtained by running the stated query
  against the stated dataset on 2026-09-07 with a read-only developer token.
  Nothing in this file was inferred from column names alone — REPL-SPE-01's
  Barcode-vs-Item-Code episode is the standing reminder that a
  plausibly-named column is not evidence.

# ── The consolidated source dataset ─────────────────────────────────────────
source_dataset:
  alias: "replenishment_order_details"
  domo_dataset_name: "DEV|Rytail|OUT|Replenishment Order Details"
  confirmed_id: "8152de75-f313-47f6-a50c-48b524fcb503"
  direct_query_instruction: >
    CRITICAL ACCESS RULE: Always query this dataset directly by its confirmed UUID
    '8152de75-f313-47f6-a50c-48b524fcb503' via query_dataset(dataset_id="8152de75-f313-47f6-a50c-48b524fcb503", sql=...).
    Do NOT call search_dataset() or list_datasets() to locate it, as Domo developer-token
    search filters out ETL-generated tables. The dataset is active, live, and fully queryable in Domo.
  grain: >
    VERIFIED LIVE: one row per Sale Store Code + Sale Product Code (550,397
    distinct pairs across 550,836 rows). 178 stores, 40,139 product codes,
    11,254 References, 250 Families. Multiple product codes (sizes) roll up to
    one Reference, so a size -> Reference aggregation is executed in query_a.
  columns:
    - "Sale Store Code"                 # retail store code (StoreCode)
    - "Sale Product Code"               # item code, 'ETH######' / 'E#####' space
    - "Reference"                       # product reference — PRE-JOINED, rolled up
    - "Last7 Days Sale Qty"             # replaces REPL-SPE-01 view_2.Qty_7d (feeds W1)
    - "Last28 Days Sale Qty"            # replaces REPL-SPE-01 view_2.Qty_28d (feeds W2, W3)
    - "Available Stock Days (7 days)"   # 7-day availability window
    - "Available Stock Days (28days)"   # feeds W4 StockAdjustedFactor
    - "Current Stock Qty"               # replaces view_3.StockOnHandQty (Store stock)
    - "Warehouse Current Stock Qty"     # REPL-ELIG-01 warehouse stock on hand
    - "Order StoreCode"                 # REDUNDANT — identical to Sale Store Code, 0 diffs
    - "Order Product Code"              # REDUNDANT — identical to Sale Product Code, 0 diffs
    - "Ordered Qty"                     # an EXISTING replenishment quantity
    - "SKU"
    - "Size"
    - "Division"
    - "Family"
    - "Season"
    - "Style"
    - "Color"
    - "Product Brand"            # single-valued: 'STYLE UNION'
    - "Section"
    - "Department"
    - "Brand"                    # single-valued: 'STYLE UNION'
  verified_facts:
    availability_is_reference_grain: >
      VERIFIED LIVE and LOAD-BEARING: "Available Stock Days" does NOT vary
      within a Store+Reference group — a query for groups where
      MIN(...) <> MAX(...) returned ZERO groups, for BOTH the 7-day and
      28-day columns, across all 303,898 Store+Reference groups. The ETL
      computed availability at Reference level and repeated the value on each
      size row.
      THIS IS WHY THE SIZE -> REFERENCE ROLL-UP IS LOSSLESS. MAX() simply
      recovers that one repeated value. Without this fact W4 would be
      unreproducible from this dataset, because "days on which COMBINED stock
      across all sizes was zero" (the rule Pugal confirmed for
      REPL-SPE-01 view_3) cannot be reconstructed from per-size day counts.
      NEVER use SUM() on these columns: three sizes would yield 81 days.
    stock_is_size_grain: >
      VERIFIED LIVE: "Current Stock Qty" DOES vary within Store+Reference
      (104,177 groups vary). SUM() is therefore correct for stock, matching
      REPL-SPE-01 view_3 step (c)'s "SUM STOCK_ONHAND_QTY per Store+Reference".
    duplicate_rows_from_corrupted_reference: >
      VERIFIED LIVE: 213 Store+Product groups appear MORE THAN ONCE (439 rows
      total). Cause is character corruption in the Reference string, not
      genuine duplication: e.g. 'BEK00007TURQUOISE SHIMMER\xa0' (trailing
      non-breaking space) versus the same value with a U+FFFD replacement
      character before the nbsp. All measures are byte-identical across the
      copies.
      CONSEQUENCE: a naive SUM double-counts — one physical stock of 31
      becomes 62. The inner pass of query_a/query_b handles this by
      aggregating with MAX() at Store+Reference+Product level first (MAX over
      identical duplicates returns the value unchanged). Do not remove that
      inner pass. Same class of hazard as product_master's literal duplicate
      rows, which REPL-SPE-01 handles with DISTINCT.
      NOT FIXED: TRIM() does not strip a non-breaking space or a replacement
      character, so the two spellings still group separately and one physical
      reference can surface as two output rows. Scope is 213 of 303,898 groups
      (0.07%); no affected reference is in BOYS CORE DENIM. FLAGGED, not solved.
    no_nulls: >
      VERIFIED LIVE: zero NULLs in "Last7 Days Sale Qty", "Last28 Days Sale
      Qty" and "Current Stock Qty" across all 550,836 rows. The IFNULL guards
      in decisions.sell_through_formula are therefore defensive rather than
      currently load-bearing — keep them anyway, since an upstream ETL change
      could introduce NULLs silently.
    negatives_are_real: >
      VERIFIED LIVE at row level: 3,687 rows have a negative "Last7 Days Sale
      Qty", 542 negative "Last28", 4,729 negative "Current Stock Qty", 2,503
      negative "Warehouse Current Stock Qty". "Ordered Qty" is never negative.
      AFTER the size -> Reference roll-up, 1,496 of 303,898 groups still have
      a negative 7-day total, 348 a negative 28-day total, and 4,467 a
      negative stock total (~2% of groups).
      For BOYS CORE DENIM's 733 thresholded Store+Reference rows there are
      ZERO negative totals — so the family used to validate this playbook does
      not exercise the negative path at all. Other families will. See
      decisions.negative_value_handling.
    availability_never_reaches_the_window_length: >
      VERIFIED LIVE: "Available Stock Days (7 days)" ranges 0..6 (533,724 of
      550,836 rows sit at exactly 6) and "Available Stock Days (28days)"
      ranges 1..27 (399,264 rows at exactly 27). NEITHER EVER REACHES 7 OR 28.
      CONSEQUENCE: StockAdjustedFactor_pct computed as avail28/28 is capped at
      96.4286% and can never be 100%, whereas REPL-SPE-01's live run produced
      exactly 100.0 for every row in its sample. See
      decisions.w4_denominator — this is an OPEN question, not a resolved one.
    product_attributes_are_missing_on_63_percent_of_rows: >
      VERIFIED LIVE, AND THE MOST IMPORTANT FACT IN THIS FILE:
        - 200,284 rows have product attributes AND "Ordered Qty" > 0
        - 350,552 rows have BLANK Family/Size/Division/Section AND
          "Ordered Qty" = 0
      The correlation is exactly 100% in both directions. The product-master
      join in the upstream ETL landed only on rows that received an order.
      CONSEQUENCE: `WHERE Family = '<x>'` is EQUIVALENT to
      `WHERE "Ordered Qty" > 0`. Filtering by Family therefore restricts an
      ELIGIBILITY computation to rows where something was already ordered —
      circular, and a silent selection bias.
      MEASURED COST on the 7 thresholded BOYS CORE DENIM references:
        WHERE TRIM(Reference) IN (...)      -> 733 Store+Reference groups
        WHERE Family = 'BOYS CORE DENIM'    -> 497 Store+Reference groups
      i.e. the Family filter loses 236 groups (32%). Worked example:
      E0100 / BCDN00003MID STONE has three size rows totalling Qty_28d = 8;
      the Family filter keeps one of them, reporting Qty_28d = 3.
      THEREFORE: scope EVERY query in this playbook by an explicit Reference
      list resolved from product_master (see computation.query_0). NEVER by
      Family against this dataset.
    references_do_not_span_families: >
      VERIFIED LIVE: zero References map to more than one Family (0 rows
      affected). This is what makes the Reference-list scoping in query_0 a
      safe substitute for a Family filter.
    sale_and_order_keys_are_identical: >
      VERIFIED LIVE: "Sale Store Code" <> "Order StoreCode" in 0 rows, and
      "Sale Product Code" <> "Order Product Code" in 0 rows. The Order* pair
      is redundant; ignore it.
    no_date_column: >
      VERIFIED by enumerating all 23 columns: there is NO date, snapshot or
      as-of column anywhere in this dataset. See open_blockers.no_anchor_date.

