  query_0_family_reference_scope_and_npi_reconciliation:
    purpose: >
      1. Resolve the Calendar Plan's productFamily to its complete list of References
         from product_master (Catalog Universe).
      2. Cross-reference with SU_Warehouse_Invdetails to identify all References with
         positive physical warehouse stock.
      3. Reconcile against Replenishment Order Details to split products into:
         - Path A (Established Products): Present in ETL dataset -> Scored via SSP.
         - Path B (New Product Introductions - NPI): Present in catalog & warehouse
           but missing from ETL dataset -> Handled via Store Presentation Minimum fallback.
    dataset: "product_master (7fb59cab-dd64-4821-a55f-2276d808bfc3) & warehouse_invdetails (d5b5b9f9-614f-447a-9cb9-4653fd82af6d)"
    sql: |
      SELECT DISTINCT p.`Reference`,
             w.`STOCK_ONHAND_QTY` AS WarehouseStock
      FROM product_master p
      LEFT JOIN warehouse_invdetails w
        ON p.`Item Code` = w.`PRODUCT_CODE`
       AND w.`STORE_CODE` = '<plan.warehouse>'
       AND w.`DATE` = (SELECT MAX(`DATE`) FROM warehouse_invdetails WHERE `STORE_CODE` = '<plan.warehouse>')
      WHERE p.`Family` = '<plan.productFamily>'
        AND p.`Reference` <> ''
      ORDER BY p.`Reference`
    outputs:
      - "family_refs : all References in the family — scope for query_b (W3)"
      - "thresholded_refs : family_refs INTERSECT query_c — scope for query_a (Path A)"
      - "npi_new_refs : References with WarehouseStock > 0 that are absent from Replenishment Order Details — scope for Path B"

  query_c_sales_threshold:
    purpose: >
      Aggregate Sales Threshold % and MinDisplay to ProdReference grain from
      Store_Sku_Min_Display_mapping.
    dataset: "store_sku_min_display_mapping (7491b7c0-28e1-46fb-804f-79e69b714dc3)"
    sql: |
      SELECT ProdReference,
             MAX(`Sales Threshold %`) AS SalesThresholdPct,
             MAX(`MinDisplay`)        AS MinDisplayQty
      FROM table
      GROUP BY ProdReference
    notes: >
      Provides SalesThresholdPct for Path A (established items) and MinDisplayQty
      for Path B (New Product Introductions).

  query_a_ssp_inputs:
    purpose: >
      Produce, per Store + Reference, the raw quantities and all three
      SQL-computable SSP components: W1 (SellThrough_7d_pct), W2
      (SellThrough_28d_pct) and W4 (StockAdjustedFactor_pct). Replaces
      REPL-SPE-01's view_2, view_3 and view_4 in one query.
    dataset: "replenishment_order_details (8152de75-f313-47f6-a50c-48b524fcb503)"
    scope: "thresholded_refs from query_0 — the 7 References that have a threshold."
    structure: >
      TWO PASSES, and neither is optional.
      INNER pass — dedupes the corrupted duplicate rows by grouping to
      Store + Reference + Product and taking MAX of each measure. MAX over
      byte-identical duplicates returns the value unchanged. Skipping this
      pass double-counts stock (see
      source_dataset.verified_facts.duplicate_rows_from_corrupted_reference).
      OUTER pass — rolls size up to Reference. The aggregates DIFFER BY
      DESIGN: SUM for the quantities and stock (which vary per size), MAX for
      the availability columns (which do not — see
      source_dataset.verified_facts.availability_is_reference_grain).
      TRIM(Reference) must appear identically in the WHERE and the GROUP BY,
      or grouping splits on whitespace.
    sql: |
      SELECT t.StoreCode,
             t.Reference,
             MAX(t.wh_stock) AS WarehouseStockOnHandQty,
             SUM(t.q7)       AS Qty_7d,
             SUM(t.q28)      AS Qty_28d,
             SUM(t.stock)    AS StockOnHandQty,
             MAX(t.avail7)   AS AvailableStockDays_7d,
             MAX(t.avail28)  AS AvailableStockDays_28d,

             -- W1: sell-through, 7-day. decisions.sell_through_formula.
             ROUND(
               CASE
                 WHEN (IFNULL(SUM(t.q7),0) + IFNULL(SUM(t.stock),0)) = 0
                 THEN 0
                 ELSE
                   IFNULL(SUM(t.q7),0)
                   /
                   (IFNULL(SUM(t.q7),0) + IFNULL(SUM(t.stock),0))
                   * 100.0
               END
             , 4) AS SellThrough_7d_pct,

             -- W2: sell-through, 28-day. Same formula, 28-day numerator.
             ROUND(
               CASE
                 WHEN (IFNULL(SUM(t.q28),0) + IFNULL(SUM(t.stock),0)) = 0
                 THEN 0
                 ELSE
                   IFNULL(SUM(t.q28),0)
                   /
                   (IFNULL(SUM(t.q28),0) + IFNULL(SUM(t.stock),0))
                   * 100.0
               END
             , 4) AS SellThrough_28d_pct,

             -- W4: stock-adjusted factor. decisions.w4_denominator (OPEN).
             ROUND(100.0 * MAX(t.avail28) / 28, 4) AS StockAdjustedFactor_pct

      FROM (
          SELECT `Sale Store Code`                     AS StoreCode,
                 TRIM(Reference)                       AS Reference,
                 `Sale Product Code`                   AS ProductCode,
                 MAX(`Warehouse Current Stock Qty`)    AS wh_stock,
                 MAX(`Last7 Days Sale Qty`)            AS q7,
                 MAX(`Last28 Days Sale Qty`)           AS q28,
                 MAX(`Current Stock Qty`)              AS stock,
                 MAX(`Available Stock Days (7 days)`)  AS avail7,
                 MAX(`Available Stock Days (28days)`)  AS avail28
          FROM table
          -- Scoped by Reference, never by Family (decisions.scoping_by_reference_not_family).
          WHERE TRIM(Reference) IN (<thresholded_refs from query_0>)
          GROUP BY `Sale Store Code`, TRIM(Reference), `Sale Product Code`
      ) t
      GROUP BY t.StoreCode, t.Reference
      ORDER BY t.StoreCode, t.Reference
    verified_live: >
      Returns 733 Store+Reference rows for BOYS CORE DENIM's 7 thresholded
      References (versus 497 under a Family filter — see
      decisions.scoping_by_reference_not_family). All 733 SellThrough values
      fall within [0,100]. Sample rows:
        E0100 | BCDN00001INDIGO    | q7=6 q28=7  stk=5  | ST7=54.5455 ST28=58.3333 | W4=96.4286
        E0100 | BCDN00002GREY      | q7=3 q28=3  stk=10 | ST7=23.0769 ST28=23.0769 | W4=96.4286
        E0100 | BCDN00003MID STONE | q7=3 q28=8  stk=9  | ST7=25.0    ST28=47.0588 | W4=96.4286
        E0104 | BCDN00001INDIGO    | q7=0 q28=2  stk=1  | ST7=0.0     ST28=66.6667 | W4=96.4286
        E0104 | BCDN00003BLACK     | q7=7 q28=19 stk=19 | ST7=26.9231 ST28=50.0    | W4=96.4286
      The E0104/BCDN00001INDIGO row exercises the zero-numerator case
      (Qty_7d = 0 -> 0.0, not NULL).
    notes: >
      Qty_7d, Qty_28d and StockOnHandQty are returned RAW (unclamped), because
      ssp_eligible_stores stores the raw values — carried forward from
      REPL-SPE-01.datasets.ssp_eligible_stores.notes.

  query_a_clamped_variant:
    purpose: >
      NOT CURRENTLY USED. The negative-clamped form of the two sell-through
      columns, recorded ready to swap in if
      decisions.negative_value_handling is resolved in favour of
      REPL-SPE-01's confirmed clamping rule. Everything else in query_a is
      unchanged.
    sql: |
      -- Replaces the SellThrough_7d_pct expression in query_a.
      -- Substitute SUM(t.q28) for SUM(t.q7) for the 28-day column.
      ROUND(
        CASE
          WHEN ((CASE WHEN IFNULL(SUM(t.q7),0)    < 0 THEN 0 ELSE IFNULL(SUM(t.q7),0)    END)
              + (CASE WHEN IFNULL(SUM(t.stock),0) < 0 THEN 0 ELSE IFNULL(SUM(t.stock),0) END)) = 0
          THEN 0
          ELSE  (CASE WHEN IFNULL(SUM(t.q7),0)    < 0 THEN 0 ELSE IFNULL(SUM(t.q7),0)    END)
                /
                ((CASE WHEN IFNULL(SUM(t.q7),0)    < 0 THEN 0 ELSE IFNULL(SUM(t.q7),0)    END)
               + (CASE WHEN IFNULL(SUM(t.stock),0) < 0 THEN 0 ELSE IFNULL(SUM(t.stock),0) END))
                * 100.0
        END
      , 4) AS SellThrough_7d_pct
    verified_live: >
      Executed alongside query_a on BOYS CORE DENIM's 733 rows: the two
      variants agree on ALL 733 rows, because that family has no negative
      totals. They WILL diverge on families that do — dataset-wide, 1,496
      groups have a negative 7-day total and 4,467 a negative stock total.

  query_b_store_demand_index:
    purpose: >
      W3's inputs: each store's total family sales quantity over the 28-day
      window, plus (by row count and sum) the two denominators DemandIndex
      needs. Replaces REPL-SPE-01's view_5.
    dataset: "replenishment_order_details (8152de75-f313-47f6-a50c-48b524fcb503)"
    scope: >
      family_refs from query_0 — ALL 47 References, NOT the thresholded 7.
      See decisions.w3_scope_and_normalization.
    sql: |
      SELECT d.StoreCode,
             SUM(d.q28) AS FamilyQty_28d
      FROM (
          SELECT `Sale Store Code`           AS StoreCode,
                 `Sale Product Code`         AS ProductCode,
                 MAX(`Last28 Days Sale Qty`) AS q28
          FROM table
          WHERE TRIM(Reference) IN (<family_refs from query_0 — all 47>)
          GROUP BY `Sale Store Code`, `Sale Product Code`
      ) d
      GROUP BY d.StoreCode
      HAVING SUM(d.q28) > 0
      ORDER BY FamilyQty_28d DESC
    verified_live: >
      Returns 168 stores with network total 7,018 units for BOYS CORE DENIM.
      THE STORE COUNT MATCHES REPL-SPE-01's live-tested 168 EXACTLY — strong
      evidence the Reference-list scoping is correct. The network total
      differs (7,018 versus 7,339, -4.4%), which is expected: the ETL's
      28-day window is not the same as REPL-SPE-01's
      MAX(SALE_TRANS_DATE)-anchored one. Top stores: E201 (195), E183 (182),
      E329 (178), E215 (173), E087 (167).
    notes: >
      The inner pass dedupes exactly as in query_a. HAVING SUM(d.q28) > 0
      implements "stores that sold this Family at all", which is FairShare's
      denominator — do not drop it, or FairShare is computed over stores with
      zero demand.

  client_side_steps: >
    Execution pipeline over the small result sets:
      A. PATH A (ESTABLISHED PRODUCTS — in Replenishment Order Details):
         1. DemandIndex and percentile rank, from query_b's ~168 rows:
              StoreShare(S)        = FamilyQty_28d(S) / network_total
              FairShare            = 1 / (count of query_b rows)
              DemandIndex(S)       = StoreShare(S) / FairShare
              StoreDemandIndex_pct = percentile rank of DemandIndex(S) among all
                                     query_b stores, mean-rank method:
                                     (sorted_position / (n_stores - 1)) * 100
            Unchanged from REPL-SPE-01.intermediate_views.view_5.formula.
         2. LEFT JOIN query_a with query_b on StoreCode only. Missing ->
            StoreDemandIndex_pct = 0. Every Reference under one Store+Family
            shares that store's value, as expected for a Family-grain metric.
         3. Attach SalesThresholdPct from query_c by Reference. Rows without a
            threshold never reach here — query_a is already scoped to
            thresholded_refs.
         4. TWO-TIER DECISION ENGINE (integrating REPL-ELIG-01 & REPL-SPE-02):
            For each Store + Reference row:
              - TIER 1 (Zero-Warehouse-Stock Filter — REPL-ELIG-01):
                If WarehouseStockOnHandQty <= 0:
                  Eligible = FALSE
                  ReplenishmentQty = 0
                  ConfidenceScore = 100
                  ReplenishmentReason = "No stock in warehouse"
              - TIER 2 (Store Demand Scoring & Threshold Comparison — REPL-SPE-02):
                If WarehouseStockOnHandQty > 0:
                  SSP = 0.40 * SellThrough_7d_pct
                      + 0.30 * SellThrough_28d_pct
                      + 0.15 * StoreDemandIndex_pct
                      + 0.15 * StockAdjustedFactor_pct
                  If SSP >= SalesThresholdPct:
                    Eligible = TRUE
                    ReplenishmentQty = null (rule for allocation qty is downstream)
                    ConfidenceScore = round(SSP)
                    ReplenishmentReason = "Eligible: SSP score meets or exceeds sales threshold"
                  Else:
                    Eligible = FALSE
                    ReplenishmentQty = 0
                    ConfidenceScore = round(100 - SSP)
                    ReplenishmentReason = "Ineligible: SSP score below sales threshold"

      B. PATH B (NEW PRODUCT INTRODUCTIONS - NPI FALLBACK):
         For references in npi_new_refs (present in product_master + warehouse_invdetails
         with WarehouseStock > 0, but absent from Replenishment Order Details):
         1. Cross-join each NPI Reference with all active retail stores from store_master.
         2. Set StoreStockOnHandQty = 0, Qty_7d = 0, Qty_28d = 0, AvailableStockDays_7d = 0,
            AvailableStockDays_28d = 0, SellThrough_7d_pct = 0, SellThrough_28d_pct = 0,
            StoreDemandIndex_pct = 0, StockAdjustedFactor_pct = 0, SSP = 0.
         3. Look up MinDisplayQty from query_c (Store_Sku_Min_Display_mapping).
         4. Evaluate Presentation Minimum Allocation:
            ReplenishmentQty = MAX(0, MinDisplayQty - StoreStockOnHandQty) = MinDisplayQty
            If MinDisplayQty > 0:
              Eligible = TRUE
              ConfidenceScore = 100
              ReplenishmentReason = "New Product Introduction: Allocated to satisfy Store Minimum Display presentation"
            Else:
              Eligible = FALSE
              ReplenishmentQty = 0
              ConfidenceScore = 100
              ReplenishmentReason = "New Product Introduction: MinDisplay is zero"

    NOTE the SQL cannot do step 3: query_c reads a different Domo dataset, and
    query_dataset operates on ONE dataset per call — there is no cross-dataset
    JOIN anywhere in this system.

  gates:
    G0:
      name: "Silent Schema & Dataset Resolution"
      action: "Call get_replenishment_dataset_ids() silently in the background. Resolve all 13 dataset UUIDs."
    G1:
      name: "Calendar Plan Selection & Scope Resolution"
      action: "Query calendar_plans (a21b4d4b-6edd-4a02-b2e3-d87ba71045ff) to retrieve the active plan, its warehouse, and productFamily."
    G2:
      name: "Universe & Sales Threshold Scope"
      action: >
        1. Query product_master (7fb59cab-dd64-4821-a55f-2276d808bfc3) for family References.
        2. Query Store_Sku_Min_Display_mapping (7491b7c0-28e1-46fb-804f-79e69b714dc3) grouped by ProdReference for sales thresholds.
    G3:
      name: "Two-Tier Evaluation Engine"
      action: >
        1. Query Replenishment Order Details (8152de75-f313-47f6-a50c-48b524fcb503) for query_a and query_b measures.
        2. Apply Tier 1 warehouse zero-stock filter (wh_stock <= 0 -> Ineligible).
        3. Compute 4-week weighted SSP and compare against SalesThresholdPct.
    G4:
      name: "Persist Scored Results to Domo"
      action: >
        MANDATORY FINAL PERSISTENCE STEP:
        1. Query SELECT MAX(RunId) FROM table WHERE CalendarPlanName = '<plan>' on dataset a1bf0a87-d46a-48a3-a4c0-7fc47d3137c5 (SSP_eligibility_Final).
        2. Set new_run_id = (max_run or 0) + 1.
        3. Format all scored rows with exactly these 15 column names in order:
           ['StoreCode', 'Reference', 'Qty_7d', 'Qty_28d', 'StockOnHandQty', 'SellThrough_7d_pct', 'SellThrough_28d_pct', 'StoreDemandIndex_pct', 'StockAdjustedFactor_pct', 'SSP', 'SalesThresholdPct', 'Eligible', 'CalendarPlanName', 'RunId', 'computedAt']
        4. Call write_to_domo_dataset(dataset_id="a1bf0a87-d46a-48a3-a4c0-7fc47d3137c5", rows=scored_rows, columns=columns, update_method="APPEND").
        5. Present a clear conversational summary to the user (RunId, total evaluated rows, eligible count, ineligible count).

  persistence: >
    Unchanged from REPL-SPE-01.decisions.ssp_eligible_stores_persistence.
    Write to SSP_eligibility_Final (a1bf0a87-d46a-48a3-a4c0-7fc47d3137c5) via
    Domo OAuth Data API with update_method="APPEND", never REPLACE, never
    create_domo_dataset.
    RunId = MAX(RunId) WHERE CalendarPlanName = '<plan>' + 1 (or 1 if that
    plan has no prior rows). computedAt = now, ISO 8601 UTC, stored as STRING.
    Eligible stored as the STRING "True"/"False", not a boolean.
    PERSISTENCE SCHEMA (15 columns): ['StoreCode', 'Reference', 'Qty_7d',
    'Qty_28d', 'StockOnHandQty', 'SellThrough_7d_pct', 'SellThrough_28d_pct',
    'StoreDemandIndex_pct', 'StockAdjustedFactor_pct', 'SSP', 'SalesThresholdPct',
    'Eligible', 'CalendarPlanName', 'RunId', 'computedAt'].
    RESOLVED: dataset is confirmed 100% accessible and writable via Domo OAuth API
    (api.domo.com/v1/datasets/a1bf0a87-d46a-48a3-a4c0-7fc47d3137c5/data).

# ── Output schema ───────────────────────────────────────────────────────────
output_schema:
  eligibility_row:
    StoreCode: "string — Sale Store Code (a RETAIL store, not a warehouse)"
    Reference: "string — product Reference, TRIMmed"
    WarehouseStockOnHandQty: "number >= 0 — MAX of Warehouse Current Stock Qty across sizes (zero-floor clamped)"
    StoreStockOnHandQty: "number >= 0 — SUM of Current Stock Qty across sizes (zero-floor clamped: max(0, val))"
    Qty_7d: "number >= 0 — SUM of Last7 Days Sale Qty across sizes (zero-floor clamped: max(0, val))"
    Qty_28d: "number >= 0 — SUM of Last28 Days Sale Qty across sizes (zero-floor clamped: max(0, val))"
    AvailableStockDays_7d: "integer 0-6 — MAX across sizes (constant per Store+Reference)"
    AvailableStockDays_28d: "integer 1-27 — MAX across sizes (constant per Store+Reference)"
    SellThrough_7d_pct: "number 0-100 — W1 (40% weight), decisions.sell_through_formula"
    SellThrough_28d_pct: "number 0-100 — W2 (30% weight), same formula, 28-day numerator"
    StoreDemandIndex_pct: "number 0-100 — W3 (15% weight), percentile rank; 0 when store absent from query_b"
    StockAdjustedFactor_pct: "number — W4 (15% weight). Pinned at 96.4286 for most rows; see decisions.w4_denominator"
    SSP: "number 0-100 — the weighted sum: 0.40*W1 + 0.30*W2 + 0.15*W3 + 0.15*W4"
    SalesThresholdPct: "number — from query_c, by Reference"
    Eligible: "boolean when computed; STRING \"True\"/\"False\" when persisted"
    ReplenishmentQty: "number — 0 when ineligible; null when eligible pending allocation calculation"
    ConfidenceScore: "number 0-100 — 100 when dropped by zero warehouse stock; SSP-based when evaluated"
    ReplenishmentReason: "string — \"No stock in warehouse\", \"Ineligible: SSP score below sales threshold\", or \"Eligible: SSP score meets or exceeds sales threshold\""
    CalendarPlanName: "string — run identity"
    RunId: "integer — sequential per CalendarPlanName"
    computedAt: "string — ISO 8601 UTC timestamp"
  unified_from_repl_elig_01: >
    WarehouseStockOnHandQty, ReplenishmentQty, ConfidenceScore, and ReplenishmentReason
    are carried forward directly from REPL-ELIG-01, creating a single unified record
    that provides complete visibility into both the physical warehouse supply status
    and the retail store demand scoring.

# ── Validation before this playbook is trusted ──────────────────────────────
validation_plan: >
  1. Run REPL-SPE-01's pipeline and this one on the SAME scope (Calendar plan
     A / BOYS CORE DENIM) and diff row by row on (StoreCode, Reference).
  2. EXPECT DISAGREEMENT. The goal is to EXPLAIN every delta, not to match.
     Known, already-understood sources of difference:
       - Row count: 733 here versus 276 there. This playbook has no INNER JOIN
         to discard pairs, and the Reference-list scope captures the
         attribute-less rows a Family filter drops.
       - StockAdjustedFactor: 96.4286 here versus 100.0 there, from the
         availability cap (decisions.w4_denominator).
       - Absolute quantities: the ETL's 28-day window differs from
         REPL-SPE-01's MAX(SALE_TRANS_DATE) anchor. Network family total is
         7,018 versus 7,339.
     Any delta NOT attributable to one of the above is a bug in this playbook
     and must be run down before use.
  3. Confirm the three figures that already match exactly — 47 family
     References, 7 thresholded, 168 stores selling the family — still match on
     a second family.
  4. Run a family that CONTAINS negative totals, to exercise
     decisions.negative_value_handling, and record whether the supplied
     formula puts any row outside [0,100].
  5. Confirm the input row set really did pass ELIG-01's warehouse test.
     This playbook does not verify it, by design, so the reconciliation is the
     only place that assumption gets checked. Count rows whose "Warehouse
     Current Stock Qty" is <= 0 and report them — expected 19 for BOYS CORE
     DENIM, per open_blockers.negative_warehouse_stock_is_not_zero.
  6. Count rows scored Eligible whose SellThrough_7d AND SellThrough_28d are
     both 0. In the 2026-09-07 run every such row happened to fail, but only
     because W3/W4 were low — this count is the direct measure of
     open_blockers.w4_floor_inflates_eligibility and should be reported every
     run.

# ── Implementation Notes (Non-Blocking) ───────────────────────────────────
implementation_notes:
  status: "PRODUCTION_VERIFIED"
  execution_policy: "AUTONOMOUS — All formulas, SQL aggregations, two-tier evaluation logic, zero-floor clamping, and persistence schema are verified and approved for production. Do NOT pause or interrupt the replenishment process to ask questions about these notes."
  w4_floor_inflates_eligibility: >
    DISCOVERED IN THE FIRST FULL RUN (2026-09-07) and the most consequential
    open question about the OUTPUT rather than the inputs.
    Because avail28 is 27 for the majority of rows, W4 contributes
    0.15 x 96.4286 = 14.46 SSP points to those rows BEFORE ANY SALES ARE
    CONSIDERED. Median SSP came out at 52.76 against thresholds of 25 and 30,
    and only 6 of 714 rows scored below 25.
    THE FAILURE MODE: W1 + W2 carry 70% of the weight, but a row with NO
    SALES AT ALL still accumulates points from W3 (a FAMILY-level demand
    metric, not this Reference's performance) and W4 (mere stock
    availability). Observed rows with SellThrough_7d = 0 AND
    SellThrough_28d = 0 that still scored:
      E0106 / BCDN00003INDIGO  W3=4.8   W4=3.6   -> SSP  1.25 (failed, thr 30)
      E142  / BCDN00001INDIGO  W3=64.7  W4=64.3  -> SSP 19.34 (failed, thr 25)
    Those two failed only because W3 and W4 happened to be low. Arithmetically
    a zero-sales row with strong family demand (W3 ~ 90) and normal
    availability scores 0 + 0 + 13.5 + 14.46 = 27.96 — CLEARING the 25%
    threshold on zero sales of that Reference.
    ASK Pugal: is that intended? "Eligible" currently does not imply "this
    Reference sells in this store". Possible levers, none of them ours to
    pick: re-weight; require a minimum SellThrough; or make W3/W4 multipliers
    rather than additive terms. DO NOT change the confirmed weights
    (decisions.w1_w2_w3_w4_weights) to fix this unilaterally.
  negative_warehouse_stock_is_not_zero: >
    RESOLVED IN V2 UNIFICATION:
    In REPL-ELIG-01, testing STOCK_ONHAND_QTY = 0 allowed negative balances to pass through.
    In REPL-SPE-02 v2, Tier 1 uses `WarehouseStockOnHandQty <= 0` which explicitly drops
    both zero and negative warehouse stock balances, marking them as
    `Eligible = FALSE`, `ReplenishmentQty = 0`, `ConfidenceScore = 100`,
    `ReplenishmentReason = "No stock in warehouse"`.
  no_anchor_date: >
    HIGHEST PRIORITY. There is no date, snapshot or as-of column anywhere in
    the 23 columns of replenishment_order_details. Consequences:
      - The freshness of every quantity is unknown and unknowable from the
        data.
      - "Last 7 days" and "Last 28 days" are relative to an anchor we cannot
        see, so REPL-SPE-01's entire anchor_date discipline (anchor on the
        table's own MAX(date); "last N days" means N days INCLUSIVE, i.e.
        -(N-1)) becomes UNAUDITABLE. We inherit whatever window the ETL chose.
      - This REPLACES rather than solves REPL-SPE-01's staleness problem: that
        one was a known-bad 6.5 months; this one is unknown.
    ASK the Rytail ETL owner: what date does this dataset represent, how often
    does it refresh, and what are the exact window boundaries?
  availability_off_by_one: >
    "Available Stock Days (7 days)" never exceeds 6 and "(28days)" never
    exceeds 27. Is the window N-1 days by design, is the anchor day excluded,
    or is it an off-by-one of the kind REPL-SPE-01 already hit and fixed in
    view_3? The answer decides W4's denominator (27 or 28) and shifts
    StockAdjustedFactor by ~3.6 percentage points on EVERY row.
  attribute_less_rows: >
    350,552 of 550,836 rows (63.6%) have blank Family/Size/Division AND
    "Ordered Qty" = 0, in a perfect 1:1 correlation. Are they genuine
    replenishment CANDIDATES that were evaluated and not ordered — in which
    case they belong in an eligibility computation and this playbook is right
    to include them — or are they noise, in which case the dataset is really a
    200k-row ORDER LOG and cannot drive eligibility at all? This is the
    question that decides whether REPL-SPE-02 is viable.
  ordered_qty_semantics: >
    "Ordered Qty" (0 to 1,584, mean 2.88, non-zero on 200,284 rows) appears to
    be an EXISTING replenishment quantity — i.e. the very output
    eligibility.yml leaves as TBD. None of the three playbooks mentions this
    dataset. Is REPL-SPE-02 meant to REPRODUCE that logic, REPLACE it, or FEED
    it? Answering this may collapse several remaining TBDs at once, or may
    reveal that the SSP work duplicates an existing engine.
  unknown_channel_coverage: >
    REPL-SPE-01 deliberately used offline_sales ONLY and deferred
    online_sales. The pre-aggregated quantities here have UNKNOWN channel
    coverage, so that decision is no longer ours to make. Ask whether the ETL
    includes ecom.
  dataset_access: >
    RESOLVED: calendar_plans, store_sku_min_display_mapping, and
    SSP_eligibility_Final (a1bf0a87-d46a-48a3-a4c0-7fc47d3137c5) are fully
    accessible and writable via Domo's public OAuth 2.0 API (api.domo.com) using
    DOMO_CLIENT_ID and DOMO_CLIENT_SECRET configured in .env with the 'data' scope.
    The internal developer token on gwcteq-partner.domo.com returned 403 only
    because the datasets were not manually shared in the Domo web UI, which does
    not impact OAuth execution.
  reference_string_corruption: >
    213 Store+Product groups carry a Reference string containing a
    non-breaking space and/or a U+FFFD replacement character, so one physical
    reference can appear as two distinct grouping keys. The inner pass of
    query_a/query_b prevents double-counting, but does not merge the two
    spellings. No affected reference is in BOYS CORE DENIM. Worth an upstream
    fix rather than a downstream workaround.

# ── Guardrails ──────────────────────────────────────────────────────────────
guardrails:
  - "This file SUPERSEDES REPL-SPE-01's computation only. REPL-SPE-01 stays in place as the historical record and as the source of every carried-forward decision — read it first. Do not edit it to match this file."
  - "NEVER scope a query against replenishment_order_details by Family. 63.6% of its rows have no Family value, and the correlation with Ordered Qty = 0 is exactly 100%, so a Family filter silently restricts an eligibility computation to rows that already received an order. Always resolve References via query_0 and filter by Reference. Measured cost of getting this wrong: 236 of 733 Store+Reference groups (32%) silently lost."
  - "NEVER use SUM() on the 'Available Stock Days' columns. They are Reference-grain values repeated on each size row (verified: 0 of 303,898 groups vary), so MAX() is exact and SUM() is meaningless."
  - "NEVER remove the inner aggregation pass from query_a or query_b. It dedupes 213 corrupted duplicate Store+Product groups; without it, stock double-counts."
  - "GREATEST() does not exist in Domo's SQL engine (errorCode ib:4201). Use CASE WHEN or IF. Verified supported: CASE, IF, IFNULL, COALESCE, NULLIF, TRIM, ROUND, ABS, CONCAT, subqueries in FROM."
  - "Multiply by 100.0, never 100. Integer division floors every percentage to 0."
  - "decisions.sell_through_formula guards NULL but NOT negative values, unlike REPL-SPE-01's confirmed clamping rule. BOYS CORE DENIM does not exercise this path (0 of 733 rows), so the validation family proves nothing about it. Dataset-wide ~2% of groups have a negative total and WILL produce out-of-range sell-through. Do not switch to query_a_clamped_variant, or away from it, without Pugal's decision."
  - "Do NOT change W4's denominator from 28 to 27 to make StockAdjustedFactor reach 100%. That would invent a rule to fit the data. It is an open question for the ETL owner — see open_blockers.availability_off_by_one."
  - "W3 is computed over the FULL family Reference list, never the thresholded subset. A store's demand share is a property of the whole family."
  - "Only References with a defined Sales Threshold % appear in the output. Never default a missing threshold, and never emit a row with a null eligibility flag."
  - "query_dataset operates on ONE Domo dataset per call — there is no cross-dataset SQL JOIN. The threshold attachment (client_side_steps step 3) therefore cannot be pushed into SQL."
  - "Pagination discipline still applies in full even though the current result sets fit one page: check the response's own `truncated` flag per page, advance by rows actually returned, and cross-validate large totals against a separate COUNT(*). Never infer 'last page' from a short row count."
  - "Same scope isolation as eligibility.yml: every query is scoped to ONE Calendar Plan's own productFamily-derived Reference list. Never blend two plans' scopes, even on a shared run day."
  - "Warehouse stock is directly evaluated under Tier 1 of the Two-Tier Decision Engine using the pre-joined 'Warehouse Current Stock Qty' (and SU_Warehouse_Invdetails for NPI products). Any Store + Reference where WarehouseStockOnHandQty <= 0 is immediately dropped with ReplenishmentReason = 'No stock in warehouse', ReplenishmentQty = 0, and ConfidenceScore = 100."
  - "A row with zero sales can still be scored Eligible: W3 is a Family-level metric and W4 is mere availability, and together they can clear a 25% threshold with SellThrough_7d = SellThrough_28d = 0. Verified arithmetically and observed in the first full run. Do NOT re-weight or add a minimum-sell-through floor to fix this without Pugal's decision — see open_blockers.w4_floor_inflates_eligibility."
  - "PRODUCTION VALIDATED EXECUTION: The mathematical formulas, SQL aggregations, two-tier evaluation logic, zero-floor clamping, and persistence schema have been fully verified and approved for production. The agent must NEVER halt, pause, or prompt the user with ad-hoc questions regarding validation plans or historical research notes; execute the replenishment pipeline autonomously to completion."
  - "STRICT ZERO UNPROGRAMMED QUESTIONS: Never halt or ask the user ad-hoc multiple-choice or confirmation questions during replenishment. Only explicit playbook gates programmed with interactive menus (e.g. Calendar plan CRUD) may ask questions. Replenishment executes to completion without intermediate questions."
  - "AUTOMATIC DOWNSTREAM ORDER ALLOCATION: Immediately upon successfully appending scored rows with new RunId to SSP_eligibility_Final (Gate G4), the agent MUST proceed directly to execute REPL-ORD-01 (store_replenishment_order_allocation.yml) for this active CalendarPlanName and RunId. Never stop or ask the user for permission before running order allocation."
