# ── Computation ──
computation:
  status: >
    CONFIRMED, LIVE-TESTED END-TO-END 2026-08-28 — the full SSP +
    eligibility pipeline is now built and verified against Calendar plan
    A's scope (family=BOYS CORE DENIM). This is the first complete
    run of REPL-SPE-01's core computation.
  pipeline: >
    1. Resolve family scope: product_master Item Code → Reference map
       (191 Item Codes, 47 References for the test family).
    2. Resolve threshold coverage: JOIN the 47 References against
       store_sku_min_display_mapping's ProdReference (view_1's source) —
       only References WITH a defined Sales Threshold % proceed (7 of 47
       in the test scope — see decisions.threshold_coverage_gap). This
       narrows the Item Code scope for steps 3-5 to just those
       References' Item Codes (49 of 191) — a deliberate optimization,
       not a correctness requirement.
    3. Build view_2 (sales) and view_3 (stock, incl. DaysWithoutStock_28d)
       scoped to the narrowed Item Code set, per their own definitions.
    4. Build view_4: INNER JOIN view_2/view_3 on (StoreCode, Reference),
       compute SellThrough_7d_pct, SellThrough_28d_pct (W1, W2, with
       negative-value clamping) and StockAdjustedFactor_pct (W4).
    5. Build view_5: Store Demand Index (W3), computed over the FULL
       family scope (all 191 Item Codes / 47 References) — NOT narrowed
       to the 7 thresholded References, since W3 measures a store's
       demand share of the WHOLE family, independent of which specific
       References happen to have a threshold defined.
    6. LEFT JOIN view_4 with view_5 by StoreCode (decisions.
       view4_view5_join_type) — missing StoreDemandIndex_pct → 0.
    7. Compute SSP = 0.40×SellThrough_7d_pct + 0.30×SellThrough_28d_pct +
       0.15×StoreDemandIndex_pct + 0.15×StockAdjustedFactor_pct for every
       (StoreCode, Reference) row that has both a view_4 result AND a
       defined threshold (step 2's narrowing already guarantees the
       threshold; rows lacking StockAdjustedFactor_pct — i.e. no
       DaysWithoutStock data — are skipped, not defaulted).
    8. Eligible = (SSP >= SalesThresholdPct) — decisions.
       ssp_threshold_comparison.
  verified_facts: >
    Live-tested end-to-end 2026-08-28, Calendar plan A (family=BOYS CORE
    DENIM): 7 of 47 References had a defined threshold (25% for
    BCDN00001INDIGO/BCDN00002GREY, 30% for the four BCDN00003* variants).
    Scoped to 49 Item Codes → view_2: 765 Store+ProductCode-level rows
    (before Reference re-aggregation) → view_3 b1: 265 Store+Reference
    pairs, b2: 286 pairs → view_4 (INNER JOIN): 276 Store+Reference pairs
    → view_5: 168 stores with a DemandIndex (full-family scope, same as
    the standalone view_5 test). FINAL: 276 Store+Reference rows with a
    computed SSP and a defined threshold (every view_4 row had
    StockAdjustedFactor_pct available in this test — none skipped for
    that reason). ALL 276 SSP values fell within [0,100] (sanity check
    passed). 244 of 276 (88%) came out Eligible (SSP >= threshold).
    Sample row: StoreCode E081, Reference BCDN00002GREY,
    SellThrough_7d_pct=50.0, SellThrough_28d_pct=80.0,
    StoreDemandIndex_pct=20.96, StockAdjustedFactor_pct=100.0, SSP=62.14,
    SalesThresholdPct=25, Eligible=True. OBSERVATION (not yet
    investigated further): StockAdjustedFactor_pct was 100.0 for every
    row shown in the sample output — plausible for this specific
    narrow/well-stocked test scope (only 49 Item Codes across 7
    References), but not confirmed as a general pattern across the whole
    catalog; flagged for awareness, not treated as a bug.
  output_schema: >
    StoreCode, Reference, Qty_7d, Qty_28d, StockOnHandQty (raw, unclamped —
    added 2026-08-28 per Pugal), SellThrough_7d_pct, SellThrough_28d_pct,
    StoreDemandIndex_pct, StockAdjustedFactor_pct, SSP, SalesThresholdPct,
    Eligible (boolean in the computed result; stored as STRING
    "True"/"False" in the persisted Domo dataset — see
    datasets.ssp_eligible_stores.notes).
  persistence: >
    RESOLVED 2026-08-28 (with Pugal): output is written to a NEW Domo
    dataset, "SSP Eligible Stores" (confirmed_id
    4e508e9f-cd26-4352-ada5-792569fcd6c9), created via create_domo_dataset
    2026-08-28 — see datasets.ssp_eligible_stores below and
    decisions.ssp_eligible_stores_persistence for the full convention
    (first-run creation vs. append-going-forward, RunId semantics).
    eligibility.yml's own persistence note (for the zero-stock rule) is
    STILL separately unresolved — this resolution is SPE-01-specific,
    not a precedent automatically applied there.

# ── Guardrails ──
guardrails:
  - "This playbook EXTENDS eligibility.yml (REPL-ELIG-01) — it does not redefine eligibility.yml's scheduling/scope-isolation architecture or its zero-stock rule (step_5). Read eligibility.yml first; this file only covers the non-zero-stock (SSP) case."
  - "Do not invent the still-TBD parts of the SSP formula (sell-through denominator, demand-index formula, stock-adjustment formula, normalization, threshold comparison operator) — see decisions and computation.status above. Only what's explicitly confirmed and live-tested is safe to build on."
  - "query_dataset operates on ONE Domo dataset per call — there is no cross-dataset SQL JOIN. Every 'view' in this file that spans two datasets (e.g. view_2) is a CLIENT-SIDE merge of two separate single-dataset queries, not one SQL statement. Do not attempt a JOIN clause across dataset_ids."
  - "offline_sales/online_sales/store_invdetails windows ('last N days') anchor on MAX(SALE_TRANS_DATE) or MAX(DATE) from the table itself, NOT system current date — live-tested gap of ~23 days between offline_sales' latest data and system today (2026-08-27). Same pattern as eligibility.yml's step_2."
  - "'Last N days' means N calendar days INCLUSIVE of the anchor date: DATE >= DATE_ADD(anchor, -(N-1)) AND DATE <= anchor (i.e. -6/-27 for 7/28 days, NOT -7/-28). The -7/-28 form is an off-by-one that spans 8/29 days — see decisions.anchor_date. view_2's step (b) SQL still needs re-running with this fix; view_3's DaysWithoutStock queries already use the corrected form."
  - "Sales Threshold % aggregation (view_1) is aggregation ONLY — per Pugal, do not compare it against any store's SSP until the full SSP calc is defined and this file is updated to say so explicitly."
  - "online_sales is confirmed schema-compatible but deliberately NOT included in view_2 yet (offline_sales only) — do not assume sales quantities anywhere in this playbook already include online channel data until decisions.view_1_sales_source is updated."
